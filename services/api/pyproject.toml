[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concierge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "alembic>=1.16,<2",
  "PyJWT[crypto]>=2.9,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "anthropic>=0.40,<2"
]

[project.optional-dependencies]
crawl = ["playwright>=1.48,<2"]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "mypy>=1.17,<2", "aiosmtpd>=1.4,<2", "playwright>=1.48,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S608", "S105", "S106", "I001", "E501"]
"alembic/versions/*" = ["S608"]
"tests/conftest.py" = ["E402", "S608", "S105", "S106"]
"src/concierge/prompt.py" = ["E501"]
